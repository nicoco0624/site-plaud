{% extends "base.html" %}
{% block title %}Créer un compte — Site Plaud{% endblock %}

{% block content %}
<section class="card auth-card">
  <h2>Créer un compte</h2>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="auth-form">
    <input type="email" name="email" placeholder="Adresse email"
           autocomplete="email" autofocus required>
    <input type="password" name="password" placeholder="Mot de passe (8 caractères min.)"
           autocomplete="new-password" required>
    <input type="password" name="password2" placeholder="Confirmer le mot de passe"
           autocomplete="new-password" required>
    <button type="submit">Créer mon compte</button>
  </form>
  <p class="auth-switch">Déjà un compte ? <a href="/login">Se connecter</a></p>
</section>
{% endblock %}
