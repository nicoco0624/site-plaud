{% extends "base.html" %}

{% block content %}
<div class="tabs">
  <input type="radio" name="tab" id="tab-upload" checked>
  <input type="radio" name="tab" id="tab-notes">

  <nav class="tab-bar" role="tablist">
    <label for="tab-upload">Nouvel enregistrement</label>
    <label for="tab-notes">Mes notes <span id="notes-count" class="tab-count">{{ notes_count }}</span></label>
  </nav>

  <section class="tab-panel panel-upload card">
    <h2>Nouvel enregistrement</h2>

    <form id="upload-form"
          hx-post="/upload"
          hx-encoding="multipart/form-data"
          hx-target="#upload-result"
          hx-swap="innerHTML"
          hx-on::after-request="if (event.detail.successful) { this.reset();
            document.getElementById('dropzone').querySelector('strong').textContent = 'Glisse un fichier audio ici';
            document.getElementById('tab-notes').checked = true; }">
      <label id="dropzone" for="file-input">
        <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M7 9l5-5 5 5"/>
          <path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/>
        </svg>
        <strong>Glisse un fichier audio ici</strong>
        <span>ou clique pour parcourir</span>
        <em>mp3, wav, m4a — {{ max_upload_mb }} Mo max</em>
      </label>
      <input id="file-input" type="file" name="file"
             accept=".mp3,.wav,.m4a,.webm,.ogg,.opus,audio/*" required>
      <button type="submit">Envoyer</button>
    </form>

    <div class="or-sep"><span>ou</span></div>

    <div class="rec">
      <button type="button" id="rec-btn" class="rec-btn">
        <span class="rec-dot"></span><span class="rec-label">Enregistrer au micro</span>
      </button>
      <span id="rec-time" class="rec-time" hidden>0:00</span>
      <button type="button" id="rec-cancel" class="link-btn" hidden>annuler</button>
    </div>
    <p id="rec-msg" class="row-hint" hidden></p>

    <div id="upload-result" aria-live="polite"></div>
  </section>

  <section class="tab-panel panel-notes card">
    <h2>Mes notes</h2>
    <div id="notes"
         hx-get="/notes"
         hx-trigger="load, refreshNotes from:body"
         hx-swap="innerHTML">
      <p class="muted">Chargement…</p>
    </div>
  </section>
</div>

<script>
  // Retour visuel du drag & drop.
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('file-input');
  ['dragenter', 'dragover'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(evt =>
    dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      dz.querySelector('strong').textContent = e.dataTransfer.files[0].name;
    }
  });
  input.addEventListener('change', () => {
    if (input.files.length) dz.querySelector('strong').textContent = input.files[0].name;
  });

  // ---- Enregistrement direct au micro ----
  (function () {
    const btn = document.getElementById('rec-btn');
    const label = btn.querySelector('.rec-label');
    const timeEl = document.getElementById('rec-time');
    const cancelEl = document.getElementById('rec-cancel');
    const msg = document.getElementById('rec-msg');
    const form = document.getElementById('upload-form');
    let rec, chunks, stream, t0, timer, cancelled;

    if (!navigator.mediaDevices || !window.MediaRecorder) {
      btn.disabled = true;
      btn.title = "Enregistrement non pris en charge par ce navigateur";
      return;
    }

    const pickMime = () =>
      ['audio/webm', 'audio/ogg', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    const extOf = m => m.includes('ogg') ? 'ogg' : m.includes('mp4') ? 'm4a' : 'webm';
    const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

    async function start() {
      msg.hidden = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        msg.textContent = "Micro inaccessible — autorise l'accès au microphone.";
        msg.hidden = false;
        return;
      }
      const mime = pickMime();
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      cancelled = false;
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(timer);
        timeEl.hidden = true;
        cancelEl.hidden = true;
        btn.classList.remove('recording');
        label.textContent = 'Enregistrer au micro';
        if (cancelled || !chunks.length) return;
        const type = (rec && rec.mimeType) || mime || 'audio/webm';
        const blob = new Blob(chunks, { type });
        const file = new File([blob], 'enregistrement-' + Date.now() + '.' + extOf(type), { type });
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        dz.querySelector('strong').textContent = file.name;
        form.requestSubmit();
      };
      rec.start();
      t0 = Date.now();
      timeEl.textContent = '0:00';
      timeEl.hidden = false;
      cancelEl.hidden = false;
      btn.classList.add('recording');
      label.textContent = 'Arrêter';
      timer = setInterval(() => {
        timeEl.textContent = fmt(Math.floor((Date.now() - t0) / 1000));
      }, 500);
    }

    btn.addEventListener('click', () => {
      if (rec && rec.state === 'recording') rec.stop();
      else start();
    });
    cancelEl.addEventListener('click', () => {
      cancelled = true;
      if (rec && rec.state === 'recording') rec.stop();
    });
  })();
</script>
{% endblock %}
