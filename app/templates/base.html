<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site Plaud{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version('app.css') }}">
  <script src="/static/htmx.min.js?v={{ asset_version('htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🎙️</span>
      <h1>Site Plaud</h1>
    </div>
    <p class="tagline">Vos notes vocales, transcrites, résumées et archivées automatiquement.</p>
    <nav class="pipeline">
      <span>Upload</span>
      <span>Transcription</span>
      <span>Résumé</span>
      <span>Archivage</span>
      <span>Email</span>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span class="dot"></span>
    <span>Traitement 100&nbsp;% automatique — propulsé par Whisper &amp; un LLM</span>
  </footer>
</body>
</html>
