<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site Plaud{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version('app.css') }}">
  <script src="/static/htmx.min.js?v={{ asset_version('htmx.min.js') }}" defer></script>
  <script src="/static/app.js?v={{ asset_version('app.js') }}" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round">
          <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>
        </svg>
      </span>
      <h1>Site Plaud</h1>
    </a>
    {% block subhead %}
      <p class="tagline">Vos notes vocales, transcrites, résumées et archivées automatiquement.</p>
    {% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span class="dot"></span>
    <span>Traitement 100&nbsp;% automatique — propulsé par Whisper &amp; un LLM</span>
    {% if user %}<span class="user-chip">{{ user.email }} · <a class="logout-link" href="/logout">déconnexion</a></span>{% endif %}
  </footer>
</body>
</html>
