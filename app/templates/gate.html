{% extends "base.html" %}
{% block title %}Accès — Site Plaud{% endblock %}

{% block content %}
<section class="card auth-card">
  <h2>Accès réservé</h2>
  <p class="muted login-hint">Entre le code d'accès pour continuer.</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/gate" class="auth-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <input type="password" name="password" placeholder="Code d'accès"
           autocomplete="off" autofocus required>
    <button type="submit">Entrer</button>
  </form>
</section>
{% endblock %}
