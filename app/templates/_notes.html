{# met à jour le compteur de l'onglet, où que se fasse ce rendu #}
<span id="notes-count" class="tab-count" hx-swap-oob="true">{{ notes | length }}</span>
{% if not notes %}
  <p class="muted">Aucune note pour l'instant.</p>
{% else %}
  <table class="notes">
    <thead>
      <tr><th>Fichier</th><th>Taille</th><th>Statut</th><th>Sortie</th><th>Créée</th><th></th></tr>
    </thead>
    <tbody>
      {% for n in notes %}
        {% include "_note_row.html" %}
      {% endfor %}
    </tbody>
  </table>
{% endif %}
