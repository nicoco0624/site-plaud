{% if not notes %}
  <p class="muted">Aucune note pour l'instant.</p>
{% else %}
  <table class="notes">
    <thead>
      <tr><th>Fichier</th><th>Taille</th><th>Statut</th><th>Sortie</th><th>Créée</th></tr>
    </thead>
    <tbody>
      {% for n in notes %}
        {% include "_note_row.html" %}
      {% endfor %}
    </tbody>
  </table>
{% endif %}
