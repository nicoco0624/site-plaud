{% extends "base.html" %}
{% block title %}Nouveau mot de passe — Site Plaud{% endblock %}

{% block content %}
<section class="card auth-card">
  <h2>Nouveau mot de passe</h2>
  {% if invalid %}
    <p class="alert error">{{ error }}</p>
    <p class="auth-switch"><a href="/forgot">Refaire une demande</a></p>
  {% else %}
    {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
    <form method="post" action="/reset" class="auth-form">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="password" placeholder="Nouveau mot de passe (8 caractères min.)"
             autocomplete="new-password" autofocus required>
      <input type="password" name="password2" placeholder="Confirmer le mot de passe"
             autocomplete="new-password" required>
      <button type="submit">Enregistrer et me connecter</button>
    </form>
  {% endif %}
</section>
{% endblock %}
